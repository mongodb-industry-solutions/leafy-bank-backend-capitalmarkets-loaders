---
# TEMPORARY pipeline — ist-prod green deployment (blue/green cutover).
# Triggers only on the `prod-green` branch, so the `prod` pipeline above (branch: main)
# is untouched and the blue release keeps serving.
# Deleted at Phase 3, when the `prod` pipeline above is repointed at these green values.
kind: pipeline
type: kubernetes
name: production-bian

trigger:
  branch:
    - prod-green
  event:
    - push

steps:
  - name: publish-backend
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/capitalmarkets-loaders-bian
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}
        - latest
      dockerfile: Dockerfile.backend
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key
    when:
      event:
        - push

  - name: deploy-backend-prod-bian
    image: public.ecr.aws/kanopy/drone-helm:v3
    settings:
      chart: mongodb/web-app
      chart_version: 4.25.0
      add_repos: [mongodb=https://10gen.github.io/helm-charts]
      namespace: industrysolutions
      release: capitalmarkets-loaders-bian-prod
      values:
        - 'image.tag=git-${DRONE_COMMIT_SHA:0:7}'
        - 'image.repository=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/capitalmarkets-loaders-bian'
        - 'ingress.enabled=true'
        - 'ingress.hosts[0]=capitalmarkets-loaders-bian.industrysolutions.prod.corp.mongodb.com'
        - 'mesh.enabled=true'
        - 'resources.limits.cpu=500m'
        - 'resources.limits.memory=1536Mi'
        - 'resources.requests.cpu=200m'
        - 'resources.requests.memory=1024Mi'
      api_server: https://api.prod.corp.mongodb.com
      kubernetes_token:
        from_secret: prod_kubernetes_token
      values_files: ['environments/prod-bian.yaml']
    when:
      event:
        - push
